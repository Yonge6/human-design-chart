<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buer Within — AI Growth Coach App Store Posters</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#0b1627;color:#f4f8ff;font-family:"Helvetica Neue","PingFang SC",sans-serif}
    #poster{--w:1284px;--h:2778px;position:relative;width:var(--w);height:var(--h);overflow:hidden;background:radial-gradient(circle at 82% 8%,#31537b 0,transparent 34%),radial-gradient(circle at 8% 78%,#173b55 0,transparent 38%),linear-gradient(154deg,#07111f 0%,#142a42 58%,#0d1c30 100%)}
    .aurora{position:absolute;inset:-180px -220px auto auto;width:1350px;height:900px;object-fit:cover;opacity:.3;filter:saturate(1.15);mask-image:linear-gradient(150deg,#000 18%,transparent 78%)}
    .orb-glow{position:absolute;width:1100px;height:1100px;border:1px solid #aee9fb24;border-radius:50%;right:-570px;top:390px;box-shadow:0 0 180px #83cdf31f,inset 0 0 100px #8edbf313}
    .brand{position:absolute;top:82px;left:86px;display:flex;align-items:center;gap:22px}.brand img{width:68px;height:68px}.brand strong{font-family:Georgia,"Songti SC",serif;font-size:38px;font-weight:500;letter-spacing:1px}.brand small{display:block;margin-top:4px;color:#a9c3d8;font-size:20px;letter-spacing:3px}
    .counter{position:absolute;top:103px;right:88px;color:#a8c6da;font-size:24px;letter-spacing:4px}
    .copy{position:absolute;z-index:2;top:230px;left:88px;right:76px}.eyebrow{margin-bottom:25px;color:#a8e7f7;font-size:25px;font-weight:700;letter-spacing:5px}.copy h1{max-width:1120px;margin:0;font-family:Georgia,"Songti SC",serif;font-size:94px;font-weight:400;line-height:1.13;letter-spacing:-2px}.copy p{max-width:1060px;margin:26px 0 0;color:#bfd1e1;font-size:32px;line-height:1.48;letter-spacing:.2px}
    .device{position:absolute;z-index:1;left:96px;top:700px;width:1092px;height:2160px;padding:14px;border:2px solid #b8dbed66;border-radius:82px;background:linear-gradient(145deg,#6d899c,#102336 34%,#050b13);box-shadow:0 52px 150px #000b,0 0 130px #75c6f421;overflow:hidden}.device::before{content:"";position:absolute;inset:10px;border:1px solid #d4effa24;border-radius:69px;pointer-events:none;z-index:2}.device img{display:block;width:100%;height:auto;border-radius:66px}
    .zh .copy h1{font-size:96px;letter-spacing:1px}.zh .copy p{font-size:33px;letter-spacing:1px}.variant-2 .device{top:735px}.variant-3 .device{top:720px}.variant-4 .device{top:705px}
    #poster.ipad{--w:2064px;--h:2752px}.ipad .aurora{width:2100px;height:1400px;top:-560px;right:-240px}.ipad .brand{left:132px;top:82px}.ipad .brand img{width:78px;height:78px}.ipad .brand strong{font-size:46px}.ipad .brand small{font-size:23px}.ipad .counter{right:136px;top:110px}.ipad .copy{left:134px;right:124px;top:232px}.ipad .copy h1{font-size:111px;line-height:1.1}.ipad.zh .copy h1{font-size:112px}.ipad .copy p{font-size:38px;line-height:1.42}.ipad .eyebrow{font-size:28px}.ipad .device{left:206px;top:700px;width:1652px;height:2110px;border-radius:70px;padding:16px}.ipad .device img{border-radius:50px}.ipad .device::before{border-radius:56px}.ipad.variant-2 .device,.ipad.variant-3 .device,.ipad.variant-4 .device{top:710px}
  </style>
</head>
<body>
  <main id="poster">
    <img class="aurora" src="../../../../assets/buer-aurora-hero.webp" alt="">
    <div class="orb-glow"></div>
    <div class="brand"><img src="../../../../assets/buer-orb-v2.png" alt=""><div><strong id="brand"></strong><small id="brandLine"></small></div></div>
    <div class="counter" id="counter"></div>
    <section class="copy"><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p id="subtitle"></p></section>
    <div class="device"><img id="screen" alt=""></div>
  </main>
  <script>
    const q=new URLSearchParams(location.search),lang=q.get('lang')||'en-US',device=q.get('device')||'iphone',index=Math.min(4,Math.max(1,Number(q.get('index')||1))),zh=lang==='zh-Hans';
    const copy={
      'en-US':[
        ['YOUR PERSONAL AI GROWTH COACH','Your story.\nYour next step.','Start with what matters now, then carry insight into real life.'],
        ['FOUR-DOMAIN REFLECTION','See your life\nfrom four angles.','Reflect on mind, body, connection and vocation—one question at a time.'],
        ['YOUR STORY, YOUR CONTROL','Bring your story.\nKeep control.','Build useful context from experiences you choose to save and share.'],
        ['FROM INSIGHT TO ACTION','Choose one step.\nLearn from action.','Define progress, set a review date and adjust from what really happens.']
      ],
      'zh-Hans':[
        ['你的专属 AI 成长教练','懂你的来时路，\n陪你走下一步。','从此刻最在意的事出发，把理解带回真实生活。'],
        ['四领域成长访谈','从四个领域，\n看见当下。','从心智、身体、关系与意义、事业出发，一次回答一个问题。'],
        ['你的经历，由你掌握','你的来时路，\n值得被记住。','把经历变成有用的成长背景，并由你决定哪些内容可以参考。'],
        ['把理解变成行动','选择一步，\n再从行动中学习。','定义进展、设定回顾日期，根据真实结果持续调整。']
      ]
    };
    const files=['01-home','02-reflection','03-story','04-action'],c=copy[lang][index-1],poster=document.querySelector('#poster');
    poster.className=[device,zh?'zh':'en',`variant-${index}`].join(' ');document.documentElement.lang=zh?'zh-CN':'en';
    document.querySelector('#brand').textContent=zh?'不二见己':'Buer Within';document.querySelector('#brandLine').textContent=zh?'AI 成长教练':'AI GROWTH COACH';document.querySelector('#counter').textContent=`0${index} / 04`;document.querySelector('#eyebrow').textContent=c[0];document.querySelector('#headline').innerHTML=c[1].replaceAll('\n','<br>');document.querySelector('#subtitle').textContent=c[2];document.querySelector('#screen').src=`../screenshots/${lang}/${files[index-1]}-${device}.png`;
    window.posterReady=false;Promise.all([...document.images].map(image=>image.decode())).then(()=>document.fonts.ready).then(()=>window.posterReady=true);
  </script>
</body>
</html>
