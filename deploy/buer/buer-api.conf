limit_req_zone $binary_remote_addr zone=buer_chat_per_ip:10m rate=8r/m;
server {
    listen 80;
    server_name buer-api.wonderelian.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/buer-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name buer-api.wonderelian.com;
    ssl_certificate /etc/letsencrypt/live/buer-api.wonderelian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buer-api.wonderelian.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64k;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    location = /v1/chat {
        limit_req zone=buer_chat_per_ip burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 100s;
        gzip off;
    }
    location = /v1/chat/status {
        proxy_pass http://127.0.0.1:8796;
    }
    location / { return 404; }
}
